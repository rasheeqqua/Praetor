name: Build PDF

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_shell_escape: true
          extra_system_packages: inkscape

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Praetor-thesis
          path: main.pdf
          retention-days: 90

      - name: Create/update latest release with PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: "Auto-generated PDF from the latest push to main."
          files: main.pdf
          prerelease: true
