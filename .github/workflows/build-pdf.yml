name: Build PDF

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-full \
            inkscape \
            biber

      - name: Compile LaTeX
        run: |
          latexmk -pdf -bibtex -interaction=nonstopmode -file-line-error main.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Praetor-thesis
          path: main.pdf
          retention-days: 90

      - name: Create/update latest release with PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: "Auto-generated PDF from the latest push to main."
          files: main.pdf
          prerelease: true
